name: Estateguru
description: >-
  Estateguru is a pan-European property-backed crowdfunding and P2P lending
  platform headquartered in Tallinn, Estonia. Founded in 2013, it connects
  retail and institutional investors with short-to-medium-term business loans
  secured by registered mortgages on real estate, operating across Estonia,
  Latvia, Lithuania, Finland, Germany, Spain and Portugal. The platform has
  facilitated over EUR 935 million in funding for 150,000+ investors from more
  than 100 countries and holds an EU ECSPR crowdservice-provider licence.
  Estateguru operates as a consumer investment product through its website and
  iOS/Android mobile apps; it publishes no public developer API, OpenAPI
  definition, SDKs, or agent surface. This profile was added to the API
  Evangelist network as a portfolio lead of Speedinvest and enriched with its
  genuinely published company link properties.
